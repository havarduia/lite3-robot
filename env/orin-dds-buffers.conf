# /etc/sysctl.d/60-dds-buffers.conf on the Orin (2026-10-28).
# A Mid-360S scan is a 520 kB PointCloud2 that Fast DDS sends over local UDP in
# ~9 fragments. At the 208 kB default receive buffer the kernel dropped fragments,
# and with them ~22% of the scans FAST-LIO2 should have had (6-8 of 10 a second).
# Applies to sockets opened after it: restart the lidar readers.
net.core.rmem_default = 8388608
net.core.rmem_max = 8388608
