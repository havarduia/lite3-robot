# Drop-in for the Orin's livox-driver.service:
#   /etc/systemd/system/livox-driver.service.d/wait-clock.conf
#
# The driver must start after the clock is set. The Orin boots with its clock
# behind (no RTC battery holding it), and when NTP steps it forward while the
# driver runs, the driver stops grouping packets into 10 Hz frames and
# publishes every packet (~2,000 msg/s of 96 points): seen twice on
# 2026-10-14 (LIDAR_ORIN_LOG.md section 22). Waits up to 90 s for NTP, then
# starts anyway: in handheld mode there is no internet, and a lidar is better
# than none (then check `ros2 topic hz /livox/lidar` before mapping).
[Unit]
After=time-sync.target
Wants=time-sync.target

[Service]
ExecStartPre=/bin/bash -c 'for i in $(seq 1 90); do [ "$(timedatectl show -p NTPSynchronized --value)" = yes ] && exit 0; sleep 1; done; echo "clock not synced after 90 s - starting the lidar anyway" >&2'
# the unit's own waits (address, first message) plus this one exceed the 90 s default
TimeoutStartSec=300
